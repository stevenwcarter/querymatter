[package]
name = "querymatter"
version = "0.1.0"
edition = "2024"
description = "Query Markdown YAML frontmatter with a SQL subset (REPL + one-shot CLI)"
keywords = ["markdown", "frontmatter", "sql", "cli", "repl"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
bincode = { version = "2", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive", "env"] }
comfy-table = "7.2.2"
csv = "1.4.0"
directories = "6.0.0"
globset = "0.4.19"
gray_matter = "0.3.2"
ignore = "0.4.31"
indexmap = { version = "2.14.0", features = ["serde"] }
regex = "1.13.1"
rustyline = "18.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlparser = "0.62.0"
thiserror = "2.0.19"
toml = "1.1.3"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.48.0"
predicates = "3.1.4"
tempfile = "3.27.0"
